name: Book checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-book.py
      - run: node examples/order-report/selftest.mjs
      - run: python3 examples/investigation/selftest.py
      - run: npm ci --ignore-scripts
        working-directory: examples/tool-contract
      - run: npm test
        working-directory: examples/tool-contract
      - run: npm audit --audit-level=low
        working-directory: examples/tool-contract
      - run: node examples/live-model/selftest.mjs
      - run: node examples/live-model/run.mjs repair --provider demo --model demo
      - run: node examples/live-model/run.mjs skill --provider demo --model demo
      - run: node examples/live-model/run.mjs session --provider demo --model demo
      - run: node examples/live-model/run.mjs context --provider demo --model demo
      - run: npm ci --ignore-scripts
        working-directory: playground
      - run: npm test
        working-directory: playground
        env:
          PI_OFFLINE: '1'
          PI_TELEMETRY: '0'
      - run: npm audit --omit=dev --audit-level=low
        working-directory: playground
